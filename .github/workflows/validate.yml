name: Validate Nkateko IDR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Validate source and privacy
        run: npm run validate
      - name: Build production site
        run: npm run build
      - name: Verify generated routes and downloads
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/CNAME
          grep -Fxq 'nm.skunkworksacademy.com' build/CNAME
          test -s build/route-recovery.js
          test -s build/downloads/nkateko-idr-12-week-calendar.ics
          test -s build/downloads/Nkateko_Mtembi_Individual_Development_Roadmap.pdf
          test "$(stat -c%s build/downloads/Nkateko_Mtembi_Individual_Development_Roadmap.pdf)" -gt 25000
          head -c 5 build/downloads/Nkateko_Mtembi_Individual_Development_Roadmap.pdf | grep -q '%PDF-'
          routes=(overview profile pathway roadmap 12-week-sprint credentials curriculum labs assignments projects calendar kpis mentor governance resources references download-and-review)
          for route in "${routes[@]}"; do
            test -s "build/idr/${route}/index.html"
            grep -Fq 'academy-navigation.js' "build/idr/${route}/index.html"
          done
          ! grep -R -Eiq '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[A-Za-z]{2,}' build/idr --include='*.html'
